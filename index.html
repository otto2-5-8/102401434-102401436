<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园失物招领</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>校园失物招领</h1>
      <p>让每一件遗失物品更快回家</p>
    </header>

    <main>
      <div class="search-box">
        <input type="search" placeholder="搜索物品名称">
        <button type="button">搜索</button>
      </div>

      <div class="type-tabs">
        <button class="active">全部</button>
        <button>寻物</button>
        <button>招领</button>
      </div>

      <div class="filter-row">
        <label for="category">物品分类：</label>
        <select id="category">
          <option>全部分类</option>
          <option>校园卡</option>
          <option>钥匙</option>
          <option>电子产品</option>
          <option>生活用品</option>
          <option>其他</option>
        </select>
      </div>

      <section>
        <h2>最新信息</h2>
        <div id="item-list" class="item-list"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="active">首页</button>
      <button>发布</button>
      <button>我的</button>
    </nav>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
