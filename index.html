<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园失物招领</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>校园失物招领</h1>
      <p>让每一件遗失物品更快回家</p>
    </header>

    <main>
      <div class="search-box">
        <input type="search" placeholder="搜索物品名称">
        <button type="button">搜索</button>
      </div>

      <div class="type-tabs">
        <button class="active">全部</button>
        <button>寻物</button>
        <button>招领</button>
      </div>

      <div class="filter-row">
        <label for="category">物品分类：</label>
        <select id="category">
          <option>全部分类</option>
          <option>校园卡</option>
          <option>钥匙</option>
          <option>电子产品</option>
          <option>生活用品</option>
          <option>其他</option>
        </select>
      </div>

      <section>
        <h2>最新信息</h2>
        <div id="item-list" class="item-list"></div>
      </section>
    </main>

    <section
      id="detail-modal"
      class="detail-modal"
      aria-hidden="true"
      hidden
    >
      <div
        class="detail-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="detail-title"
      >
        <button
          id="close-detail"
          class="close-detail"
          type="button"
          aria-label="关闭详情"
        >
          ×
        </button>

        <div class="card-header">
          <span id="detail-type" class="type-tag"></span>
          <span id="detail-status" class="status"></span>
        </div>

        <h2 id="detail-title"></h2>

        <div class="detail-content">
          <p><strong>分类：</strong><span id="detail-category"></span></p>
          <p><strong>地点：</strong><span id="detail-location"></span></p>
          <p><strong>日期：</strong><span id="detail-date"></span></p>
          <p><strong>详细描述：</strong></p>
          <p id="detail-description" class="description"></p>
          <p><strong>联系方式：</strong><span id="detail-contact"></span></p>
        </div>
      </div>
    </section>

    <nav class="bottom-nav">
      <button class="active">首页</button>
      <button>发布</button>
      <button>我的</button>
    </nav>
  </div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
